<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76" role="img" aria-label="CallBlast Logo">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Container -->
  <g transform="translate(6, 8)">
    <!-- Hex / Squircle Background -->
    <rect x="0" y="0" width="58" height="58" rx="16" fill="#0B1120" stroke="url(#cyberGrad)" stroke-width="2" />
    <rect x="3" y="3" width="52" height="52" rx="13" fill="url(#cyberGrad)" opacity="0.12" />

    <!-- Pulse Signal Rings -->
    <circle cx="29" cy="29" r="20" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.4" />

    <!-- Stylized Telephone Receiver + Lightning -->
    <path d="M19 21c.6-1.2 2-1.8 3.3-1.4l3.1 1c1.2.4 1.8 1.6 1.5 2.8l-.8 2.2c-.3.8-.1 1.7.5 2.3 2.1 2.1 4.5 3.7 7.2 4.6.8.3 1.7.1 2.2-.5l1.6-1.8c.8-1 2.2-1.2 3.3-.6l3 1.6c1.2.7 1.6 2.1 1 3.3l-1.8 3.5c-.8 1.5-2.5 2.3-4.2 2-7.2-1.3-14.1-6-18.7-12.6-3.1-4.5-4.4-9.9-3.7-14.8.2-1.7 1.5-3.1 3.2-3.4z" fill="#06B6D4" opacity="0.3" transform="scale(0.85) translate(4, 4)" />
    
    <!-- Central Lightning Spark -->
    <path d="M31 16L21 31h9l-3 14 13-17h-9l4-12z" fill="url(#cyberGrad)" filter="url(#neonGlow)" />
  </g>

  <!-- Brand Typography -->
  <!-- CALL -->
  <text x="76" y="47" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif" font-size="32" font-weight="900" letter-spacing="-0.5" fill="currentColor">
    CALL
  </text>
  
  <!-- BLAST -->
  <text x="162" y="47" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif" font-size="32" font-weight="900" letter-spacing="-0.5" fill="url(#cyberGrad)">
    BLAST
  </text>

  <!-- Badge: PRO SIMULATOR -->
  <g transform="translate(262, 28)">
    <rect x="0" y="0" width="68" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.18" stroke="#8B5CF6" stroke-width="1" />
    <text x="34" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="1" fill="#A78BFA">
      v3.8 PRO
    </text>
  </g>
</svg>

